services:
  rails_api:
    container_name: rails_api
    build:
      context: .
      dockerfile: Dockerfile
    command: ./bin/rails server -b 0.0.0.0
    ports:
      - 3000:3000
    environment:
      - RAILS_ENV=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/up"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 30s
  rails_solid_queue:
    container_name: rails_solid_queue
    build:
      context: .
      dockerfile: Dockerfile
    command: bundle exec bin/jobs
    environment:
      - RAILS_ENV=development
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USERNAME=postgres
      - DB_PASSWORD=postgres
    depends_on:
      rails_api:
        condition: service_healthy
  db:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 15s
      timeout: 30s
      retries: 5
      start_period: 30s

volumes:
  db_data: